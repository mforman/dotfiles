[ids]
*

[main]
leftmeta = layer(mac)
rightmeta = layer(mac)
leftcontrol = leftmeta
capslock = layer(extend)

# acts as Ctrl, but Cmd+Tab switches apps like macOS
[mac:C]
tab = swapm(appswitch, M-tab)

[appswitch:M]

# DreymaR Extend, ported from Karabiner
[extend]
j = left
k = down
i = up
l = right
u = home
o = end
y = pageup
h = pagedown
semicolon = backspace
p = delete
q = esc
leftbrace = esc
rightbrace = insert
space = enter
a = leftalt
d = leftshift
f = leftcontrol
z = C-z
x = C-x
c = C-c
v = C-v
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
